<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swift QR</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <link href="css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="SwiftQR.webp" type="image/x-icon">
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8">
        <div class="card shadow-lg border-0">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
            <div class="d-flex align-items-center">
              <i class="fas fa-qrcode me-2 fs-4"></i>
              <h2 class="m-0">Swift QR Generator</h2>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="darkModeToggle">
              <label class="form-check-label" for="darkModeToggle">
                <i class="fas fa-moon"></i> Dark Mode
              </label>
            </div>
          </div>

          <div class="card-body p-4">
            <form id="qrForm">
              <div class="mb-4">
                <label for="urlInput" class="form-label fw-bold">
                  <i class="fas fa-link me-2"></i>ลิงก์ (URL):
                </label>
                <input type="url" class="form-control form-control-lg" id="urlInput" placeholder="https://example.com" required>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-4">
                  <label for="sizeInput" class="form-label fw-bold">
                    <i class="fas fa-arrows-alt-h me-2"></i>ขนาด (px):
                  </label>
                  <input type="number" class="form-control" id="sizeInput" min="100" max="1000" value="300">
                </div>
                <div class="col-md-4">
                  <label for="colorInput" class="form-label fw-bold">
                    <i class="fas fa-palette me-2"></i>สีของ QR:
                  </label>
                  <input type="color" class="form-control form-control-color" id="colorInput" value="#000000" title="Choose QR color">
                </div>
                <div class="col-md-4">
                  <label for="bgColorInput" class="form-label fw-bold">
                    <i class="fas fa-fill me-2"></i>สีพื้นหลัง:
                  </label>
                  <input type="color" class="form-control form-control-color" id="bgColorInput" value="#FFFFFF" title="Choose background color">
                </div>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-4">
                  <label for="shapeSelect" class="form-label fw-bold">
                    <i class="fas fa-shapes me-2"></i>ลักษณะ QR:
                  </label>
                  <select class="form-select" id="shapeSelect">
                    <option value="square">Square</option>
                    <option value="circle">Circle</option>
                    <option value="dot">Dot</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="frameSelect" class="form-label fw-bold">
                    <i class="fas fa-square-full me-2"></i>ลักษณะกรอบ:
                  </label>
                  <select class="form-select" id="frameSelect">
                    <option value="none">ไม่มีกรอบ</option>
                    <option value="square">มีกรอบ</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="frameColorInput" class="form-label fw-bold">
                    <i class="fas fa-border-style me-2"></i>สีกรอบ:
                  </label>
                  <input type="color" class="form-control form-control-color" id="frameColorInput" value="#007bff" title="Choose frame color">
                </div>
              </div>

              <div class="mb-4">
                <label for="frameThicknessInput" class="form-label fw-bold">
                  <i class="fas fa-arrows-alt-v me-2"></i>ความหนากรอบ (%): <span id="thicknessValue">5</span>%
                </label>
                <input type="range" class="form-range" id="frameThicknessInput" min="2" max="10" value="5">
              </div>

              <div class="form-check form-switch mb-3">
                <input type="checkbox" class="form-check-input" id="centerImageCheck">
                <label class="form-check-label fw-bold" for="centerImageCheck">
                  <i class="fas fa-image me-2"></i>เพิ่มรูปภาพตรงกลาง
                </label>
              </div>

              <div class="mb-4" id="centerImageContainer" style="display:none;">
                <label for="centerImageInput" class="form-label fw-bold">
                  <i class="fas fa-upload me-2"></i>อัพโหลดภาพ (สูงสุด 25%):
                </label>
                <input type="file" class="form-control" id="centerImageInput" accept="image/*">
              </div>

              <div class="d-flex justify-content-between gap-3">
                <button type="submit" class="btn btn-primary btn-lg w-100 py-2">
                  <i class="fas fa-bolt me-2"></i>Generate QR
                </button>
                <button type="button" class="btn btn-outline-danger btn-lg w-100 py-2" id="clearBtn" disabled>
                  <i class="fas fa-trash me-2"></i>Clear
                </button>
              </div>
            </form>

            <hr class="my-4">

            <div class="text-center">
              <h4 class="mb-3">
                <i class="fas fa-eye me-2"></i>ตัวอย่างแบบเรียลไทม์
              </h4>
              <div class="qr-code-wrapper mb-3 p-3 rounded-3">
                <canvas id="previewCanvas"></canvas>
              </div>
            </div>

            <div class="text-center mt-4" id="qrResultContainer" style="display:none;">
              <h4 class="mb-3">
                <i class="fas fa-check-circle text-success me-2"></i>QR Code ที่สร้างได้
              </h4>
              <div class="qr-code-wrapper mb-3 p-3 rounded-3">
                <canvas id="qrCanvas"></canvas>
              </div>
              <button class="btn btn-success btn-lg px-4" id="downloadBtn">
                <i class="fas fa-download me-2"></i>ดาวน์โหลด QR
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="filenameModal" class="custom-modal">
    <div class="custom-modal-content">
      <div class="custom-modal-header">
        <h4 class="m-0"><i class="fas fa-file-signature me-2"></i>ตั้งชื่อไฟล์ QR Code</h4>
        <button class="close-modal-btn">&times;</button>
      </div>
      <div class="custom-modal-body">
        <p class="mb-2">คุณต้องการตั้งชื่อไฟล์ภาพหรือไม่?</p>
        <input type="text" id="filenameInput" class="form-control" placeholder="ระบุชื่อไฟล์ (ไม่ต้องใส่นามสกุล)" autocomplete="off">
        <p class="text-muted small mt-2 mb-0">
          <i class="fas fa-info-circle me-1"></i>
          หากเว้นว่าง ระบบจะใช้ชื่อจาก URL และต่อท้ายด้วย <strong>swiftqr</strong>
        </p>
      </div>
      <div class="custom-modal-footer">
        <button id="cancelModalBtn" class="btn btn-secondary">ยกเลิก</button>
        <button id="confirmModalBtn" class="btn btn-primary">
          <i class="fas fa-check me-2"></i>ตกลง
        </button>
      </div>
    </div>
  </div>

  <footer class="text-center mt-5 py-4 bg-light">
      <p class="mt-3 text-muted">© <script>document.write(new Date().getFullYear())  </script> Swift QR Generator. All rights reserved.</p>
  </footer>

  <script src="js/qrcode.min.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
